[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadyna"
version = "0.1.0"
description = "Latent Evidence Accumulation Dynamics: fitting stochastic dynamical models to latent neural time-series."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Hardy-Valentin" }]
keywords = [
    "neuroscience",
    "EEG",
    "evidence-accumulation",
    "dynamical-systems",
    "state-space-models",
    "unscented-kalman-filter",
    "consciousness",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "filterpy>=1.4.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
eeg = ["mne>=1.5", "scikit-learn>=1.3"]
viz = ["matplotlib>=3.7", "seaborn>=0.12"]
dev = ["pytest>=7.4", "ruff>=0.5", "nbstripout>=0.7"]
all = ["leadyna[eeg,viz,dev]"]

[project.urls]
Homepage = "https://github.com/ThoHardy/LEADyna"
Repository = "https://github.com/ThoHardy/LEADyna"
Issues = "https://github.com/ThoHardy/LEADyna/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/leadyna"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
